name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libgles2 libglib2.0-0
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest tests -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag climb-analysis:ci .

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Videos, keypoints and the SQLite database survive a rebuild.
      - ./data:/data
    environment:
      # lite | full | heavy. heavy costs about twice the CPU and roughly halves
      # landmark jitter on a small subject, which a climber up a wall always is.
      # Drop to lite on a constrained host - see the README.
      CLIMB_POSE_MODEL: heavy
      CLIMB_MAX_PEOPLE: "5"

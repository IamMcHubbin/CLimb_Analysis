services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Videos, keypoints and the SQLite database survive a rebuild.
      - ./data:/data
    environment:
      # lite | full | heavy. heavy costs about twice the CPU and roughly halves
      # landmark jitter on a small subject, which a climber up a wall always is.
      # Drop to lite on a constrained host - see the README.
      CLIMB_POSE_MODEL: heavy
      CLIMB_MAX_PEOPLE: "5"
      # Personal instance: keep analysed clips for a week so they can be
      # revisited, and allow uploads up to Cloudflare's 100 MB request limit.
      CLIMB_RETAIN_ANALYSED_SECONDS: "604800"
      CLIMB_MAX_UPLOAD_BYTES: "104857600"
